<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aves de la sucursal del cielo</title>
<meta name="description" content="Cinco aves comunes de Cali: cómo reconocerlas, cómo suena su canto, cómo hacen su nido y dónde verlas en la ciudad.">
<meta name="theme-color" content="#BEE5D3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Cpath d='M2 21 15 5l2 16z' fill='%231D1B2E'/%3E%3Cpath d='m11 21 15-10-4 12z' fill='%231D1B2E' opacity='.45'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400..700;1,400..500&display=swap"><style>
:root{--ink:#1D1B2E;--ivory:#FAF6F0;--grey:#55535f;--grey2:#77757f;--paper:#FBFAF8;--pbg:#BEE5D3;--cbg:#D7F0E4;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--u:calc(100vw/1440);--e1:cubic-bezier(.77,0,.18,1);--e2:cubic-bezier(.16,1,.3,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:Figtree,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--pbg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
h1,h2,h3,p,ul,dl,dd,figure{margin:0}ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
img{display:block;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.probe{position:fixed;left:0;top:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ---------- Portada (escenario) ---------- */
#stage{position:fixed;inset:0;overflow:hidden;z-index:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html.is-grabbing,html.is-grabbing *{cursor:grabbing!important}
#bg{position:absolute;inset:0;background:var(--pbg)}
#card{position:absolute;left:0;top:0;transform-origin:0 0;visibility:hidden;will-change:transform}
.lay{position:absolute;inset:0;pointer-events:none}
.obj{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;visibility:hidden}
.obj img{width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;user-select:none}
.obj.flip img{transform:scaleX(-1)}
.sh{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(closest-side,rgba(29,27,46,.3),rgba(29,27,46,0));transform-origin:0 0;will-change:transform,opacity;visibility:hidden}
.ttl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;text-align:center;white-space:nowrap;font-weight:500;letter-spacing:-.025em;line-height:1;visibility:hidden;will-change:transform,opacity}
.ttl .ln{display:block;line-height:1.02}
.ttl .sci{font-style:italic;font-weight:400;font-size:.29em;letter-spacing:0;margin-top:.55em;opacity:.7}

/* ---------- Encabezado ---------- */
#hdbg{position:fixed;left:0;right:0;top:0;height:calc(var(--sat) + 70px);z-index:55;pointer-events:none;opacity:0;transition:opacity .4s;background:color-mix(in srgb,var(--pbg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
html.scrolled #hdbg{opacity:1}
#logo{position:fixed;left:18px;top:calc(var(--sat) + 16px);z-index:60;display:flex;align-items:center;gap:9px;font-weight:500;font-size:15px;line-height:.95;letter-spacing:-.01em}
#logo svg{width:28px;height:28px;flex:none}
html[data-isla=arriba].m #logo span{display:none}
html:not(.m) #logo{left:calc(42*var(--u));top:max(16px,calc(34*var(--u)));font-size:max(16px,calc(22*var(--u)))}
html:not(.m) #logo svg{width:max(28px,calc(34*var(--u)));height:max(28px,calc(34*var(--u)))}

/* ---------- Lista izquierda (computador) ---------- */
#tabs{position:fixed;z-index:30;left:calc(46*var(--u));top:50%;transform:translateY(-50%);padding-left:calc(24*var(--u));display:flex;flex-direction:column;align-items:flex-start;gap:calc(18*var(--u))}
#tabs button{display:flex;align-items:baseline;gap:calc(12*var(--u));font-weight:500;font-size:max(15px,calc(19*var(--u)));opacity:.55;transition:opacity .4s;padding:2px 0;text-align:left;white-space:nowrap}
#tabs button:hover,#tabs button.on{opacity:1}
#tabs i{font-style:normal;font-size:max(10px,calc(11*var(--u)));opacity:.7;font-variant-numeric:tabular-nums}
#ind{position:absolute;left:0;top:0;width:2px;height:100px;background:rgba(29,27,46,.22);transform-origin:0 0}
#indp{position:absolute;inset:0;background:var(--ink);transform-origin:0 0;transform:scaleY(0)}
html.m #tabs,html.r-page #tabs{display:none}

/* ---------- Botón Conocer ---------- */
#disc{position:fixed;z-index:30;left:50%;bottom:calc(var(--sab) + 100px);transform:translateX(-50%);display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--ivory);font-weight:500;font-size:14.5px;white-space:nowrap;box-shadow:0 10px 26px rgba(29,27,46,.18)}
html[data-isla=arriba] #disc{bottom:calc(var(--sab) + 24px)}
#disc svg{width:20px;height:10px;transition:transform .5s var(--e2)}
html:not(.m) #disc{bottom:auto;height:max(52px,calc(66*var(--u)));padding:0 max(26px,calc(38*var(--u)));font-size:max(15px,calc(17*var(--u)))}
@media (hover:hover){#disc:hover svg{transform:translateX(6px)}}
html.r-page #disc{display:none}

/* ---------- Isla ---------- */
#isla{position:fixed;z-index:65;color:var(--ivory)}
.av{display:block;width:36px;height:36px;border-radius:50%;flex:none;background-repeat:no-repeat;background-size:cover;background-position:center}
/* abajo */
.isla-b{left:50%;bottom:calc(var(--sab) + 12px);transform:translateX(-50%);display:flex;align-items:center;gap:2px;height:60px;padding:0 8px;border-radius:999px;background:var(--ink);box-shadow:0 18px 40px rgba(29,27,46,.3),0 2px 6px rgba(29,27,46,.18)}
.isla-b .it{position:relative;display:flex;align-items:center;height:44px;padding:0 4px;border-radius:999px;transition:background-color .5s var(--e1),padding .5s var(--e1)}
.isla-b .it.on{background:rgba(250,246,240,.13);padding-right:15px}
.isla-b .ring{position:absolute;left:0;top:0;width:44px;height:44px;transform:rotate(-90deg);pointer-events:none;opacity:0;transition:opacity .3s}
.isla-b .it.on .ring{opacity:1}
.ring circle{fill:none;stroke:var(--ivory);stroke-width:2;stroke-linecap:round;stroke-dasharray:125.66;stroke-dashoffset:125.66}
.isla-b .nm{display:block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:14px;font-weight:500;transition:max-width .55s var(--e1),opacity .3s,margin .55s var(--e1)}
.isla-b .it.on .nm{max-width:120px;opacity:1;margin-left:9px}
@media (max-width:350px){.isla-b .it.on .nm{max-width:0;opacity:0;margin-left:0}.isla-b .it.on{padding-right:4px}}
html.r-home:not(.m) .isla-b{display:none}
/* arriba */
.isla-t{left:50%;top:calc(var(--sat) + 10px);transform:translateX(-50%);width:var(--w0,190px);height:48px;border-radius:24px;background:var(--ink);overflow:hidden;box-shadow:0 14px 34px rgba(29,27,46,.28);transition:width .5s var(--e1),height .5s var(--e1),border-radius .5s var(--e1)}
.isla-t.open{width:min(380px,calc(100vw - 24px));height:var(--h1,360px);border-radius:30px}
.isla-t .pill{position:relative;display:flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 6px;white-space:nowrap;width:max-content}
.isla-t.open .pill{width:100%}
.isla-t .num{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
.isla-t .nm{font-size:15px;font-weight:500}
.isla-t .chev{width:12px;height:8px;margin-left:auto;transition:transform .5s var(--e1)}
.isla-t.open .chev{transform:rotate(180deg)}
.isla-t .bar{position:absolute;left:22px;right:22px;bottom:4px;height:2px;border-radius:2px;background:rgba(250,246,240,.16);overflow:hidden}
.isla-t .bar i{display:block;height:100%;background:var(--ivory);transform-origin:0 0;transform:scaleX(0)}
.isla-t .lista{padding:2px 8px 10px;opacity:0;transition:opacity .2s}
.isla-t.open .lista{opacity:1;transition:opacity .35s .18s}
.isla-t .row{display:flex;align-items:center;gap:12px;width:100%;padding:7px 12px 7px 7px;border-radius:20px;text-align:left}
.isla-t .row.on{background:rgba(250,246,240,.12)}
.isla-t .row .av{width:44px;height:44px}
.isla-t .row b{display:block;font-weight:500;font-size:16px}
.isla-t .row small{display:block;font-style:italic;font-size:13px;opacity:.6;margin-top:2px}
.isla-t .rn{margin-left:auto;font-size:12px;opacity:.5;font-variant-numeric:tabular-nums}
#scrim{position:fixed;inset:0;z-index:64;background:rgba(29,27,46,.2);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
html.isla-open #scrim{opacity:1;visibility:visible}

/* ---------- Páginas ---------- */
#page{position:fixed;inset:0;z-index:20;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;visibility:hidden;background:var(--pbg)}
#page.on{visibility:visible}
.hero{position:relative;display:flow-root;background:var(--pbg);padding:0 0 60px}
.hcard{position:absolute;border-radius:26px}
.hcard .obj,.hcard .sh{visibility:visible;will-change:auto}
.htext{position:relative;padding:0 24px;text-align:center}
.lbl{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;opacity:.6}
.hero h1{font-size:clamp(34px,10vw,46px);font-weight:500;letter-spacing:-.025em;line-height:1.02;margin:12px 0 8px}
.hero .sci{font-style:italic;font-size:18px;opacity:.72}
.hero .otros{font-size:14px;line-height:1.5;opacity:.75;margin:12px auto 0;max-width:30em}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:12px;height:56px;padding:0 28px;border-radius:999px;background:var(--ink);color:var(--ivory);font-weight:500;font-size:16px;box-shadow:0 14px 34px rgba(29,27,46,.18)}
.btn>*{position:relative}
.listen{margin-top:26px;min-width:240px}
.listen .fill{position:absolute;inset:0;background:rgba(250,246,240,.18);transform-origin:0 0;transform:scaleX(0);transition:transform .25s linear}
.ico{width:18px;height:18px;flex:none}
.i-pause{display:none}.playing .i-play{display:none}.playing .i-pause{display:block}
.wrap{max-width:640px;margin:0 auto}
.sec{background:var(--paper);padding:60px 24px}
.sec h2{font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.08;margin-bottom:16px}
.sec p{font-size:17px;line-height:1.65;color:var(--grey)}
.sec p+p{margin-top:12px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.facts>div{background:var(--cbg);border-radius:18px;padding:14px 16px}
.facts .wide{grid-column:1/-1}
.facts dt{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
.facts dd{font-size:16px;font-weight:500;line-height:1.35;margin-top:5px}
.sec.canto{background:var(--cbg)}
.ono{font-size:clamp(30px,9vw,40px);font-weight:500;letter-spacing:-.02em;line-height:1.05;color:var(--ink)!important;margin:0 0 20px}
.player{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:8px 20px 8px 8px;box-shadow:0 10px 30px rgba(29,27,46,.08);margin:0 0 22px}
.pbtn{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--ivory);display:grid;place-items:center;flex:none}
.wave{flex:1;min-width:0;height:40px;display:flex;align-items:center;gap:2px;cursor:pointer}
.wave i{flex:1;min-height:3px;border-radius:2px;background:rgba(29,27,46,.2);transition:background-color .2s}
.wave i.on{background:var(--ink)}
.time{flex:none;font-size:13px;font-variant-numeric:tabular-nums;opacity:.7;min-width:2.6em;text-align:right}
.sec p.cred{font-size:13px;line-height:1.5}
.cred a,.fu a,.pf a{text-decoration:underline;text-underline-offset:2px}
.places{margin-top:22px;border-top:1px solid rgba(29,27,46,.1)}
.places li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid rgba(29,27,46,.1)}
.pin{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--pbg)}
.pin svg{width:14px;height:14px}
.places b{display:block;font-weight:500;font-size:16px;line-height:1.3}
.places .pd{display:block;font-size:14px;line-height:1.5;color:var(--grey2);margin-top:3px}
.sec p.tip{margin-top:18px;background:var(--cbg);border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.55}
.tip b{color:var(--ink);font-weight:600}
.sec.dato{background:var(--pbg)}
.sec.dato p{font-size:20px;line-height:1.5;color:var(--ink)}
.sec.fu{padding-top:24px;padding-bottom:24px}
.fu summary{cursor:pointer;font-weight:500;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px}
.fu summary::-webkit-details-marker{display:none}
.fu summary::after{content:'+';font-size:22px;font-weight:400}
.fu details[open] summary::after{content:'–'}
.fu h3{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin:18px 0 6px}
.fu li{font-size:14px;line-height:1.5;color:var(--grey);padding:5px 0;overflow-wrap:anywhere}
.otras{background:var(--pbg);padding:60px 16px 64px}
.otras h2{font-size:28px;font-weight:500;letter-spacing:-.02em;margin:0 8px 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oc{position:relative;display:block;aspect-ratio:1/1.32;border-radius:22px;overflow:hidden;transition:transform .9s var(--e2)}
.oc img{position:absolute;left:8%;top:7%;width:84%;height:58%;object-fit:contain;transition:transform 1.1s var(--e2)}
.ocn{position:absolute;left:14px;right:54px;bottom:14px}
.ocn b{display:block;font-weight:500;font-size:16px;line-height:1.15}
.ocn small{display:block;font-style:italic;font-size:12px;opacity:.65;margin-top:3px;line-height:1.3}
.arr{position:absolute;right:12px;bottom:12px;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--ivory);display:grid;place-items:center}
.arr svg{width:14px;height:10px}
@media (hover:hover){.oc:hover{transform:translateY(-8px)}.oc:hover img{transform:scale(1.05)}}
.pf{background:var(--ink);color:var(--ivory);padding:36px 24px calc(var(--sab) + 110px)}
.pf .wrap{display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.5}
.pf b{font-weight:500;font-size:16px}
.hp{padding-top:calc(var(--sat) + 120px)}
.hp .lead{font-size:17px;line-height:1.65;opacity:.85;margin:16px auto 0;max-width:34em}
.cr li{font-size:14px;line-height:1.55;color:var(--grey);padding:7px 0;border-bottom:1px solid rgba(29,27,46,.08);overflow-wrap:anywhere}
.cr li b{color:var(--ink);font-weight:500}
.cr h3{font-size:18px;font-weight:500;margin:28px 0 6px}
.cr a{text-decoration:underline;text-underline-offset:2px}
/* ---------- Recorrido de cada ave ---------- */
.ruta{position:relative;background:var(--cbg);padding:52px 14px 60px;overflow:hidden}
.ruta-linea{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(29,27,46,.13);pointer-events:none}
.ruta-linea i{position:absolute;inset:0;background:var(--ink);transform-origin:0 0;transform:scaleY(0)}
.paso{position:relative;max-width:560px;margin:0 auto 52px}
.paso:last-child{margin-bottom:0}
.nodo{position:absolute;left:50%;top:0;z-index:1;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 6px var(--cbg);transition:background-color .5s,color .5s}
.nodo svg{width:22px;height:22px}
.paso.on .nodo{background:var(--ink);color:var(--ivory)}
.tarj{background:#fff;border-radius:26px;padding:40px 18px 22px;box-shadow:0 12px 34px rgba(29,27,46,.07)}
.paso-n{font-size:11.5px;font-weight:600;letter-spacing:.1em;opacity:.45;text-align:center;font-variant-numeric:tabular-nums}
.tarj h2{font-size:25px;font-weight:500;letter-spacing:-.02em;line-height:1.1;text-align:center;margin:4px 0 14px}
.tarj p{font-size:16px;line-height:1.58;color:var(--grey)}
.tarj p+p{margin-top:8px}
.tarj .facts{margin-top:16px;gap:8px}
.tarj .facts>div{background:var(--cbg);padding:12px 14px;border-radius:16px}
.tarj .facts dd{font-size:15px}
.tarj .ono{text-align:center;margin:0 0 16px;font-size:clamp(28px,8.5vw,36px)}
.tarj .player{background:var(--cbg);box-shadow:none;margin:0 0 16px}
.tarj .cred{font-size:12.5px;line-height:1.5;margin-top:12px;color:var(--grey2)}
.tarj a{text-decoration:underline;text-underline-offset:2px}
.lug{margin-top:12px}
.lug li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(29,27,46,.08)}
.lug li:first-child{border-top:0}
.lug .pin{width:30px;height:30px}
.lug b{display:block;font-weight:500;font-size:15.5px;line-height:1.3}
.lug small{display:block;font-size:13px;color:var(--grey2);line-height:1.4;margin-top:1px}
.tarj p.hora{display:flex;gap:10px;align-items:center;margin-top:12px;background:var(--pbg);border-radius:16px;padding:11px 14px;font-size:14.5px;line-height:1.4;color:var(--ink)}
.hora svg{width:20px;height:20px;flex:none}
.gal{display:flex;gap:10px;margin:0 -18px 14px;padding:0 18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gal::-webkit-scrollbar{display:none}
.gal figure{flex:0 0 100%;margin:0;scroll-snap-align:center}
.gal.varias figure{flex-basis:86%}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;background:var(--cbg)}
.gal .ilu img{object-fit:contain;padding:12%}
.gal figcaption{font-size:12px;color:var(--grey2);margin-top:6px;line-height:1.4}
.tarj p.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips span{background:var(--pbg);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.paso-dato .tarj{background:var(--ink);color:var(--ivory)}
.paso-dato .tarj p{color:var(--ivory);font-size:18.5px;line-height:1.5;text-align:center}
.paso-dato .paso-n{opacity:.6}
.paso-dato.on .nodo{background:var(--pbg);color:var(--ink)}
.hcard .ilu{z-index:2}
.hcard .obj img{transform-origin:50% 60%}
html:not(.m) .ruta{padding:90px 40px}
html:not(.m) .tarj{padding:44px 34px 30px}
html:not(.m) .tarj .facts{grid-template-columns:1fr 1fr}

.rv{opacity:0;transform:translateY(36px);transition:opacity 1s var(--e2),transform 1.2s var(--e2)}
.rv.in{opacity:1;transform:none}
html:not(.m) .htext{max-width:640px;margin:0 auto}
html:not(.m) .sec{padding:100px 40px}
html:not(.m) .facts{grid-template-columns:repeat(4,1fr)}
html:not(.m) .grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
html:not(.m) .otras .wrap{max-width:1080px}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<span class="probe" aria-hidden="true"></span>
<h1 class="sr">Aves de la sucursal del cielo</h1>
<div id="stage" aria-hidden="true">
  <div id="bg"></div>
  <div id="card"></div>
  <div class="lay" id="lb"></div>
  <div class="lay" id="lt"></div>
  <div class="lay" id="lf"></div>
</div>
<div id="hdbg"></div>
<a id="logo" href="#/" aria-label="Inicio, Aves de la sucursal del cielo">
  <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 21 15 5l2 16z" fill="currentColor"/><path d="m11 21 15-10-4 12z" fill="currentColor" opacity=".45"/></svg>
  <span>aves de la<br>sucursal del cielo</span>
</a>

/* ---------- Gestos ---------- */

/* ---------- Conocer el ave: la pantalla se encoge hasta la tarjeta ---------- */
function discover() {

  const tgt = Math.round(S.goto);
  if (real(tgt) !== S.int) { S.int = real(tgt); S.trans = true; onChange(); }
  S.trans = true;
  cardFrom = getComputedStyle(bgEl).backgroundColor;
  cardEl.style.backgroundColor = cardFrom;
  cardEl.style.visibility = 'visible';
  gsap.to(S, { goto: tgt, rc: 1, duration: RM ? 0 : 1.5, ease: 'expo.inOut', onComplete: () => {
    S.trans = false;
    const i = S.int;
    history.pushState(null, '', '#/' + A[i].id);

    morphing = false;

/* ---------- Rutas ---------- */
function parse() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')).replace(/\/$/, '');
  if (!h) return { name: 'home' };
  if (h === 'creditos') return { name: 'creditos' };
  const i = A.findIndex(a => a.id === h);
  return i >= 0 ? { name: 'ave', i } : { name: 'home' };
}
function setRoute(r) {
  route = r;
  html.classList.toggle('r-home', r.name === 'home');
  html.classList.toggle('r-page', r.name !== 'home');}
function nav(h) {
  if ((location.hash || '#/') === h) return;
  history.pushState(null, '', h);
  onRoute(false);
}
function onRoute(first) {
  const r = parse(), prev = route;
  if (!first && prev.name === r.name && prev.i === r.i) return;
  closeIsla();
  const fromScroll = page.scrollTop;
  setRoute(r);
  if (r.name === 'home') {
    if (first) startHome();
    else showHome(prev.name === 'ave' && fromScroll < 0.3 * H ? 'morph' : 'fade');
    return;

  if (r.name === 'ave') setStageIdx(r.i);
  if (first || prev.name === 'home') showPage('fade');

}

});
addEventListener('hashchange', () => onRoute(false));

    rutaFill.style.transform = 'scaleY(' + clamp((marca - r.top) / r.height, 0, 1) + ')';
    pasos.forEach(p => p.classList.toggle('on', p.getBoundingClientRect().top < marca));
  }
}
page.addEventListener('scroll', () => requestAnimationFrame(heroScroll), { passive: true });

let io = null;
function setupReveal() {
  if (io) io.disconnect();
  const els = $$('.rv', page);
  if (RM || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
  io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { root: page, rootMargin: '0px 0px -6% 0px', threshold: 0.01 });
  els.forEach(e => io.observe(e));
}

/* ---------- Canto ---------- */
const aud = new Audio(); aud.preload = 'none';
let audUI = null;
function bindAudio(a) {
  aud.pause();
  const c = a.canto || {};
  if (!c.src) { audUI = null; return; }
  if (!aud.src.endsWith(c.src)) aud.src = c.src;
  aud.currentTime = 0;
  audUI = { btns: $$('[data-play]', page), bars: $$('[data-wave] i', page), time: $('[data-time]', page), fill: $('.listen .fill', page), dur: c.dur };
  syncAud();
}
function syncAud() {
  if (!audUI) return;
  const d = aud.duration || audUI.dur || 0, p = d ? clamp(aud.currentTime / d, 0, 1) : 0;
  audUI.btns.forEach(b => { b.classList.toggle('playing', !aud.paused); const l = b.querySelector('.lt'); if (l) l.textContent = aud.paused ? (aud.currentTime > 0 && !aud.ended ? 'Seguir escuchando' : 'Escuchar su canto') : 'Pausar'; });
  const on = Math.round(p * audUI.bars.length);
  audUI.bars.forEach((b, k) => b.classList.toggle('on', k < on));
  if (audUI.time) audUI.time.textContent = fmt(aud.paused && !aud.currentTime ? d : aud.currentTime);
  if (audUI.fill) audUI.fill.style.transform = 'scaleX(' + p + ')';
}
['play', 'pause', 'ended', 'timeupdate', 'loadedmetadata'].forEach(ev => aud.addEventListener(ev, syncAud));
aud.addEventListener('ended', () => { aud.currentTime = 0; syncAud(); });
page.addEventListener('click', e => {
  if (e.target.closest('[data-play]')) { if (aud.paused) aud.play().catch(() => {}); else aud.pause(); return; }
  const w = e.target.closest('[data-wave]');
  if (w && aud.duration) {
    const r = w.getBoundingClientRect();
    aud.currentTime = clamp((e.clientX - r.left) / r.width, 0, 1) * aud.duration;
    if (aud.paused) aud.play().catch(() => {});
  }
});

/* ---------- Inicio ---------- */
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 80); });
const r0 = parse();
S.int = r0.name === 'ave' ? r0.i : 0;
S.goto = S.smooth = S.int;
layout();
setStageIdx(S.int);
if (r0.name !== 'home') S.alpha = 1;
onRoute(true);
requestAnimationFrame(frame);
if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(layout);
// En la portada se precargan las fotos de todas las aves; si se entró por el QR de un ave, se espera a ir al inicio
addEventListener('load', () => setTimeout(() => { if (route.name === 'home') for (let i = 0; i < N; i++) loadImgs(i); }, 400));
})();
</script>
